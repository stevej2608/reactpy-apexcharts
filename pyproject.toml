[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-build-scripts"]

[[tool.hatch.build.hooks.build-scripts.scripts]]
commands = [
  "bun install --cwd src/js",
  "bun build src/js/src/index.tsx --outfile src/reactpy_apexcharts/static/bundle.js --target=browser --format=esm --no-minify",
]
artifacts = []

##############################
# >>> Hatch Build Config <<< #
##############################

[project]
name = "reactpy-apexcharts"
description = "ApexCharts components for ReactPy"
readme = "README.md"
keywords = ["React", "ReactJS", "ReactPy", "ApexCharts", "charts", "components"]
license = "MIT"
authors = [{ name = "Steve Jones", email = "jonesst2608@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Widget Sets",
  "Topic :: Software Development :: User Interfaces",
  "Environment :: Web Environment",
  "Typing :: Typed",
]
dependencies = ["reactpy==2.0.0b4"]
dynamic = ["version"]
urls.Homepage = "https://github.com/stevej2608/reactpy-apexcharts"
urls.Source = "https://github.com/stevej2608/reactpy-apexcharts"

[tool.hatch.version]
path = "src/reactpy_apexcharts/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/utils"]
artifacts = ["/src/reactpy_apexcharts/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/reactpy_apexcharts"]
artifacts = ["/src/reactpy_apexcharts/static/"]

[tool.hatch.metadata]
license-files = { paths = ["LICENSE"] }

[tool.hatch.envs.default]
installer = "uv"

#############################
# >>> Hatch Test Runner <<< #
#############################

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "asgi-tools",
  "asgiref",
  "faker>=24.3.0",
  "fastapi>=0.109.0",
  "orjson",
  "pillow>=10.2.0",
  "pixelmatch>=0.3.0",
  "playwright==1.41.1",
  "pytest-asyncio>=0.23.3",
  "pytest-timeout==2.2.0",
  "pytest>=7.4.4",
  "servestatic",
  "starlette>=0.13.6",
  "trio>=0.24.0",
  "uvicorn[standard]>=0.19.0",
]
randomize = true
matrix-name-format = "{variable}-{value}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12"]

################################
# >>> Hatch Python Scripts <<< #
################################

[tool.hatch.envs.python]
extra-dependencies = ["pyright"]

[tool.hatch.envs.python.scripts]
type_check = ["pyright reactpy_table"]

[tool.hatch.envs.javascript]
detached = true

[tool.hatch.envs.javascript.scripts]
check = ['bun install --cwd "src/js"', 'bun run --cwd "src/js" check']
fix = ['bun install --cwd "src/js"', 'bun run --cwd "src/js" format']

#########################
# >>> Generic Tools <<< #
#########################

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
# https://marketplace.visualstudio.com/items?itemName=charliermarsh.ruff
line-length = 120

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#sample-pyprojecttoml-file
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = "tests"
log_cli_level = "INFO"
filterwarnings = "ignore::DeprecationWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# -r Show extra test summary info as specified by chars:
#   (s)kipped,
#   (x)failed,
#   (X)passed,
# addopts = "-rsxX"

# asyncio_mode = "auto"
